name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: jiminlyy
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238EC5FC&color_dots=%23E0F2FF,%23BFE7FF,%238EC5FC,%235DADE2,%233498DB
            dist/github-contribution-grid-snake-dark.svg?color_snake=%238EC5FC&color_dots=%231E3A5F,%232E5B8A,%234A90E2,%236BB9F0,%238EC5FC

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
