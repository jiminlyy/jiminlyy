name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: jiminlyy
          outputs: |
            "dist/github-contribution-grid-snake.svg?color_snake=#8EC5FC&color_dots=#EAF7FF,#D6EEFF,#BFE7FF,#8EC5FC,#5DADE2"
            "dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8EC5FC&color_dots=#0B1220,#16324F,#2E5B8A,#5DADE2,#8EC5FC"

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
